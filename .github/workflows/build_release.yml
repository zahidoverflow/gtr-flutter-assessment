name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk gtr-customer-portal-release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtr-customer-portal-apk
          path: gtr-customer-portal-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Release v1.0.0 — GTR Customer Portal APK"
          body: |
            ### 📱 GTR Flutter Intern Practical Assessment
            Official Android Release APK for the GTR Customer Portal application.

            #### ✨ Features Included:
            - **Clean MVVM Architecture** with Provider state management
            - **User Authentication** with persistent JWT session handling
            - **Infinite Scroll Pagination** for customer accounts
            - **Dynamic Search & Multi-criteria Sorting** (Balance, Name, ID)
            - **Customer Details View** with complete financial overview & transaction history
            - **Error Handling & Network Retries**

            #### 📥 Download & Install:
            Download `gtr-customer-portal-release.apk` below and install it directly on your Android device.
          files: gtr-customer-portal-release.apk
          draft: false
          prerelease: false
